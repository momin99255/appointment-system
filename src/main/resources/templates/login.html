<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Appointment System | Login</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body class="auth-page"><div class="orb orb-a"></div><div class="orb orb-b"></div><main class="auth-shell"><section class="brand-panel"><span class="eyebrow">SMART CARE PLATFORM</span><h1>Healthcare appointments, simplified.</h1><p>Book trusted doctors, manage appointments and keep every visit organized in one place.</p><div class="mini-stats"><div><b>3</b><span>Roles</span></div><div><b>24/7</b><span>Access</span></div><div><b>JWT</b><span>Secure</span></div></div></section><section class="auth-card glass"><div class="logo">+</div><h2>Welcome back</h2><p class="muted">Sign in to continue to your workspace.</p><form id="loginForm"><label>Email<input id="email" type="email" placeholder="Enter your email" autocomplete="email" required></label><label>Password<input id="password" type="password" placeholder="Enter your password" autocomplete="current-password" required></label><button class="primary-btn" type="submit">Sign in <span>→</span></button><p id="message" class="message"></p></form><p class="switch">Don't have an account? <a th:href="@{/register}">Create one</a></p></section></main><script th:src="@{/js/auth.js}"></script></body></html>
