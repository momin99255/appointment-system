<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Appointment System | Dashboard</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body class="app-page"><header class="topbar"><a class="brand" th:href="@{/dashboard}"><span class="logo small">+</span><span>Appointment<span class="accent">Care</span></span></a><div class="top-actions"><span id="roleBadge" class="badge">Loading...</span><button id="themeToggle" class="icon-btn">☾</button><button id="logout" class="secondary-btn">Logout</button></div></header><main class="dashboard"><section class="hero"><div><span class="eyebrow">YOUR WORKSPACE</span><h1 id="greeting">Welcome back</h1><p id="subtitle" class="muted">Loading your dashboard...</p></div><div class="hero-mark">✦</div></section><div id="stats" class="stats-grid"></div><section id="patientView" class="role-view"><div class="section-head"><div><h2>Find a doctor</h2><p class="muted">Choose an available specialist and book a time.</p></div><input id="doctorSearch" class="search" placeholder="Search doctors..."></div><div id="doctors" class="doctor-grid"></div><div class="panel appointment-panel"><div><h2>Book appointment</h2><p class="muted">Pick a doctor, date and time.</p></div><form id="appointmentForm" class="booking-grid"><select id="doctorId" required><option value="">Select doctor</option></select><input id="appointmentDate" type="date" required><input id="appointmentTime" type="time" required><input id="reason" placeholder="Reason for visit"><button class="primary-btn" type="submit">Book appointment</button></form><p id="bookMessage" class="message"></p></div><div class="panel"><div class="section-head"><div><h2>My appointments</h2></div></div><div id="appointments"></div></div></section><section id="doctorView" class="role-view hidden"><div class="panel"><div class="section-head"><div><h2>Doctor workspace</h2><p id="doctorProfile" class="muted"></p></div><button id="availabilityBtn" class="secondary-btn">Toggle availability</button></div><div id="doctorAppointments"></div></div></section><section id="adminView" class="role-view hidden"><div class="admin-tabs"><button data-tab="users" class="tab active">Users</button><button data-tab="doctors" class="tab">Doctors</button><button data-tab="allAppointments" class="tab">Appointments</button></div><div id="adminContent" class="panel"></div></section></main><div id="toast" class="toast"></div><script th:src="@{/js/dashboard.js}"></script></body></html>
