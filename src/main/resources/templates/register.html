<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Appointment System | Register</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body class="auth-page"><div class="orb orb-a"></div><div class="orb orb-b"></div><main class="auth-shell"><section class="brand-panel"><span class="eyebrow">JOIN THE PLATFORM</span><h1>Your care journey starts here.</h1><p>Create a patient or doctor account. Admin access is controlled securely by the system.</p><div class="role-pills"><span>Patient</span><span>Doctor</span><span>Admin managed</span></div></section><section class="auth-card glass"><div class="logo">+</div><h2>Create account</h2><p class="muted">Use your own email and password.</p><form id="registerForm"><label>Name<input id="name" placeholder="Full name" autocomplete="name" required></label><label>Email<input id="email" type="email" placeholder="Enter your email" autocomplete="email" required></label><label>Password<input id="password" type="password" minlength="6" placeholder="Create a password" autocomplete="new-password" required></label><label>Account type<select id="role"><option value="PATIENT">Patient</option><option value="DOCTOR">Doctor</option></select></label><div id="doctorFields" class="hidden"><label>Specialization<input id="specialization" placeholder="e.g. Cardiology"></label><label>Phone<input id="phone" placeholder="e.g. +880 1XXXXXXXXX"></label></div><button class="primary-btn" type="submit">Create account <span>→</span></button><p id="message" class="message"></p></form><p class="switch">Already registered? <a th:href="@{/login}">Sign in</a></p></section></main><script th:src="@{/js/auth.js}"></script></body></html>
